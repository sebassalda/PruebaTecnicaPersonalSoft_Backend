databaseChangeLog:
  - changeSet:
      id: 007-create-offer-schema
      author: jssv
      changes:

        # ==========================================
        # OFERTA
        # ==========================================
        - createTable:
            tableName: oferta
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: brp_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_oferta_brp
                    references: brp(id)

              - column:
                  name: valor_oferta
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: porcentaje_descuento
                  type: NUMERIC(10,4)

              - column:
                  name: estado
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: radicador_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_oferta_radicador
                    references: usuario(id)

              - column:
                  name: fecha_radicacion
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        # ==========================================
        # OFERENTE
        # ==========================================
        - createTable:
            tableName: oferente
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: oferta_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_oferente_oferta
                    references: oferta(id)

              - column:
                  name: tipo_identificacion
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: numero_identificacion
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: nombre
                  type: VARCHAR(200)
                  constraints:
                    nullable: false

              - column:
                  name: porcentaje_participacion
                  type: NUMERIC(7,4)
                  constraints:
                    nullable: false

        # ==========================================
        # PAGO
        # ==========================================
        - createTable:
            tableName: pago
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: oferente_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_pago_oferente
                    references: oferente(id)

              - column:
                  name: tipo_pago
                  type: VARCHAR(40)
                  constraints:
                    nullable: false

              - column:
                  name: valor
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: fecha_pago
                  type: DATE

              - column:
                  name: entidad_financiera
                  type: VARCHAR(150)

        # ==========================================
        # INDICES
        # ==========================================
        - createIndex:
            tableName: oferta
            indexName: idx_oferta_brp
            columns:
              - column:
                  name: brp_id

        - createIndex:
            tableName: oferta
            indexName: idx_oferta_radicador
            columns:
              - column:
                  name: radicador_id

        - createIndex:
            tableName: oferta
            indexName: idx_oferta_estado
            columns:
              - column:
                  name: estado

        - createIndex:
            tableName: oferente
            indexName: idx_oferente_oferta
            columns:
              - column:
                  name: oferta_id

        - createIndex:
            tableName: pago
            indexName: idx_pago_oferente
            columns:
              - column:
                  name: oferente_id
