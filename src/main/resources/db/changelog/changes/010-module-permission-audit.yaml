databaseChangeLog:
  - changeSet:
      id: 010-create-module-permission-audit
      author: jssv
      changes:
        - createTable:
            tableName: auditoria_usuario_modulo
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: usuario_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: modulo_codigo
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: accion
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: realizado_por
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fecha
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
