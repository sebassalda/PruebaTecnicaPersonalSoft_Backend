databaseChangeLog:
  - changeSet:
      id: 011-create-offer-attachments
      author: jssv
      changes:
        - createTable:
            tableName: adjunto
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: oferta_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_adjunto_oferta
                    references: oferta(id)
              - column:
                  name: nombre_archivo
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: ruta_local
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: fecha_carga
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: adjunto
            indexName: idx_adjunto_oferta
            columns:
              - column:
                  name: oferta_id
