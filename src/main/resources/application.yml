spring:
  application:
    name: brp-offer-management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/brp_management}
    username: ${DB_USER:brp_user}
    password: ${DB_PASSWORD:brp_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: 60
    issuer: brp-offer-management
    attachments:
      directory: ${APP_ATTACHMENTS_DIR:./data/attachments}

