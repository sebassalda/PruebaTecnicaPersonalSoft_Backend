services:
  postgres:
    image: postgres:17-alpine
    container_name: brp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-brp_management}
      POSTGRES_USER: ${DB_USER:-brp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "5433:5432"
    volumes:
      - brp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: backend-secrets.env
        format: raw
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-brp_management}
      DB_USER: ${DB_USER:-brp_user}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Define APP_JWT_SECRET en .env}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:-60}
      APP_LIQUIBASE_CONTEXTS: bootstrap-admin,demo-users
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@brp.local}
      APP_ATTACHMENTS_DIR: /app/data/attachments
    ports:
      - "8080:8080"
    volumes:
      - brp_attachments:/app/data/attachments

volumes:
  brp_postgres_data:
  brp_attachments:
